name: tests

# The three packages are tested separately because they have different
# dependencies, and that separation is the point: the scanner and the virtual
# PXC need nothing installed, and only the bridge pulls bacpypes3. If either
# dependency-free job ever starts needing a requirements file, something has
# been wired the wrong way round.
#
# Actions are pinned by commit, not tag: a tag can be moved, and a moved tag
# would change what runs here without a commit in this repository.
# .github/dependabot.yml proposes updates.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  virtual-pxc:
    name: virtual PXC (no dependencies)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install pytest only
        run: python -m pip install --upgrade pip pytest
      - name: Tests
        working-directory: virtual_pxc
        run: python -m pytest tests/ -q
      - name: Self-verification against PROTOCOL.md and real-panel structure
        working-directory: virtual_pxc
        run: python verify.py

  scanner:
    name: scanner (no dependencies)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install pytest only
        run: python -m pip install --upgrade pip pytest
      - name: Tests
        run: python -m pytest tests/ -q

  bridge:
    name: bridge
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip pytest pyflakes
          python -m pip install -r bridge/requirements.txt
      - name: Lint
        run: python -m pyflakes bridge/*.py bridge/p2_bridge/*.py bridge/tools/*.py bridge/tests/*.py
      - name: Tests
        working-directory: bridge
        # Tk is absent on the runner; the SubprocessRunner tests skip themselves.
        run: python -m pytest tests/ -q
