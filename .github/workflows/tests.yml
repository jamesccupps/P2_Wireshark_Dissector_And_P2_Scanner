name: tests

# The three packages are tested separately because they have different
# dependencies, and that separation is the point: the scanner and the virtual
# PXC need nothing installed, and only the bridge pulls bacpypes3. If either
# dependency-free job ever starts needing a requirements file, something has
# been wired the wrong way round.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  virtual-pxc:
    name: virtual PXC (no dependencies)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install pytest only
        run: python -m pip install --upgrade pip pytest
      - name: Tests
        working-directory: virtual_pxc
        run: python -m pytest tests/ -q
      - name: Self-verification against PROTOCOL.md and real-panel structure
        working-directory: virtual_pxc
        run: python verify.py

  scanner:
    name: scanner (no dependencies)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install pytest only
        run: python -m pip install --upgrade pip pytest
      - name: Tests
        run: python -m pytest tests/ -q

  bridge:
    name: bridge
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip pytest pyflakes
          python -m pip install -r bridge/requirements.txt
      - name: Lint
        run: python -m pyflakes bridge/*.py bridge/p2_bridge/*.py bridge/tools/*.py bridge/tests/*.py
      - name: Tests
        working-directory: bridge
        # Tk is absent on the runner; the SubprocessRunner tests skip themselves.
        run: python -m pytest tests/ -q
